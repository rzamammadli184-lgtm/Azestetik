<!DOCTYPE html>
<html>
<head>
    <style>
        body { background: #FAF6F0; display: flex; justify-content: center; align-items: center; height: 100vh; }
        .logo-container { width: 500px; }
    </style>
</head>
<body>
    <div class="logo-container">
        <!-- AzEstetik Logo SVG -->
        <svg viewBox="0 0 450 120" xmlns="http://www.w3.org/2000/svg">
            <!-- Flower Symbol -->
            <g transform="translate(10, 10)">
                <!-- Petal Top Left -->
                <path d="M40,50 Q40,10 65,35 Q90,60 40,50 Z" fill="#2C2A29" />
                <!-- Petal Top Right -->
                <path d="M40,50 Q80,10 65,35 Q50,60 40,50 Z" fill="#2C2A29" transform="rotate(90, 40, 50)" />
                <!-- Petal Bottom Left (Green) -->
                <path d="M40,50 Q0,90 15,65 Q30,40 40,50 Z" fill="#1AB35D" />
                <!-- Petal Bottom Right -->
                <path d="M40,50 Q80,90 65,65 Q50,40 40,50 Z" fill="#2C2A29" transform="rotate(-90, 40, 50)" />
                
                <!-- Refined Flower Shape to match image better -->
                <!-- The image has slightly pointed, leaf-like petals -->
                <g fill="#2C2A29">
                     <path d="M40,50 C40,20 60,10 70,30 C80,50 50,50 40,50 Z" transform="rotate(-15, 40, 50)" />
                     <path d="M40,50 C40,20 60,10 70,30 C80,50 50,50 40,50 Z" transform="rotate(75, 40, 50)" />
                     <path d="M40,50 C40,20 60,10 70,30 C80,50 50,50 40,50 Z" fill="#1AB35D" transform="rotate(165, 40, 50)" />
                     <path d="M40,50 C40,20 60,10 70,30 C80,50 50,50 40,50 Z" transform="rotate(255, 40, 50)" />
                </g>
            </g>
            
            <!-- Logo Text -->
            <text x="100" y="75" font-family="'Poppins', sans-serif" font-weight="500" font-size="70" letter-spacing="-2">
                <tspan fill="#2C2A29">Az</tspan><tspan fill="#1AB35D">Estetik</tspan>
            </text>
            
            <!-- Group Text -->
            <text x="220" y="110" font-family="'Poppins', sans-serif" font-weight="300" font-size="24" letter-spacing="12" fill="#666">
                GROUP
            </text>
        </svg>
    </div>
</body>
</html>
